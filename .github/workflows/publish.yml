name: Publish

# Stages a release on npm through trusted publishing (OIDC, no stored token).
# A staged version isn't installable until a maintainer approves it with 2FA,
# on npmjs.com or with `npm stage approve <stage-id>`. See README → Releasing.

on:
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # `npm stage` needs npm 11.15 or newer.
      - run: npm install -g npm@^11.15.0
      - run: npm ci
      - run: npm run package
      - run: npm stage publish .
        working-directory: packages/energy-icons
